name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "Smart-Medical-Record.apk"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Signing Keystore, Static Font & Environment Files
        run: |
          touch .env .env.example
          mkdir -p app/src/main/res/font
          curl -fSL "https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hOA-a1PiKQ.ttf" -o app/src/main/res/font/cairo.ttf
          if [ -f "debug.keystore.base64" ]; then
            base64 -di debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Signed APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          BUILD_EXIT=$?
          cat build.log
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=========================================="
            echo "=== EXACT GRADLE / KOTLIN ERROR SUMMARY ==="
            echo "=========================================="
            grep -E "^e: |FAILURE:|What went wrong:|^\* " -A 6 build.log || true
            exit $BUILD_EXIT
          fi

      - name: Prepare APK for Download
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" Smart-Medical-Record.apk

      - name: Upload Ready-to-Install APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Medical-Record-APK
          path: Smart-Medical-Record.apk
          if-no-files-found: error

      - name: Save APK to Repository Root Alongside README Files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Smart-Medical-Record.apk
          git diff --staged --quiet || (git commit -m "chore: update Smart-Medical-Record.apk in root [skip ci]" && git push)
